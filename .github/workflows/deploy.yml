name: Build and deploy Platter

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  DEPLOY_PATH: /opt/platter
  PUBLIC_APP_URL: https://useplatter.ca

# Never let an older build finish after a newer push and replace it in
# production. The newest push is the only deployment that should remain live.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker build \
            -t "$image_prefix-backend:$IMAGE_TAG" \
            ./app

          docker push \
            "$image_prefix-backend:$IMAGE_TAG"

          docker build \
            --build-arg VITE_API_URL= \
            --build-arg BUILD_SHA="$IMAGE_TAG" \
            -t "$image_prefix-frontend:$IMAGE_TAG" \
            ./frontend

          docker push \
            "$image_prefix-frontend:$IMAGE_TAG"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy Compose stack on VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"

          # The VPS keeps its runtime environment locally, so copy only the
          # versioned Compose/Nginx configuration needed to run the new images.
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/deploy'"

          scp \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            deploy/docker-compose.prod.yml deploy/nginx.conf \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/"

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' BACKEND_IMAGE='$image_prefix-backend:$IMAGE_TAG' FRONTEND_IMAGE='$image_prefix-frontend:$IMAGE_TAG' bash -s" <<'REMOTE'

          set -euo pipefail

          cd "$DEPLOY_PATH"
          echo "Deploying to host: $(hostname)"

          echo "Checking Docker Compose configuration..."
          BACKEND_IMAGE="$BACKEND_IMAGE" \
          FRONTEND_IMAGE="$FRONTEND_IMAGE" \
          docker compose \
            --project-name platter \
            --env-file /opt/platter/.env \
            -f "$DEPLOY_PATH/deploy/docker-compose.prod.yml" \
            config -q

          echo "Pulling backend and frontend images..."
          BACKEND_IMAGE="$BACKEND_IMAGE" \
          FRONTEND_IMAGE="$FRONTEND_IMAGE" \
          docker compose \
            --project-name platter \
            --env-file /opt/platter/.env \
            -f "$DEPLOY_PATH/deploy/docker-compose.prod.yml" \
            pull

          echo "Running database migrations..."
          BACKEND_IMAGE="$BACKEND_IMAGE" \
          FRONTEND_IMAGE="$FRONTEND_IMAGE" \
          docker compose \
            --project-name platter \
            --env-file /opt/platter/.env \
            -f "$DEPLOY_PATH/deploy/docker-compose.prod.yml" \
            run --rm backend python migrate.py

          # The original VM stack was started from /opt/platter/docker-compose.yml.
          # It uses local builds and can keep serving an older backend under the
          # same Compose project name. Retire it explicitly before the immutable
          # image stack is brought up. Do not remove the file until the new stack
          # has passed the provenance checks below.
          legacy_compose="$DEPLOY_PATH/docker-compose.yml"
          if [ -f "$legacy_compose" ]; then
            echo "Retiring legacy Compose stack..."
            docker compose \
              --project-name platter \
              -f "$legacy_compose" \
              down --remove-orphans
          fi

          echo "Starting updated application..."
          BACKEND_IMAGE="$BACKEND_IMAGE" \
          FRONTEND_IMAGE="$FRONTEND_IMAGE" \
          docker compose \
            --project-name platter \
            --env-file /opt/platter/.env \
            -f "$DEPLOY_PATH/deploy/docker-compose.prod.yml" \
            up -d --force-recreate --wait --remove-orphans

          # A green container health check alone is not enough: prove that the
          # backend was created from this Compose file, the requested immutable
          # image, and the M1 analysis code before retiring the legacy file.
          backend_id=$(docker compose \
            --project-name platter \
            --env-file /opt/platter/.env \
            -f "$DEPLOY_PATH/deploy/docker-compose.prod.yml" \
            ps -q backend)
          test -n "$backend_id"

          actual_image=$(docker inspect "$backend_id" --format '{{.Config.Image}}')
          test "$actual_image" = "$BACKEND_IMAGE"

          frontend_id=$(docker compose \
            --project-name platter \
            --env-file /opt/platter/.env \
            -f "$DEPLOY_PATH/deploy/docker-compose.prod.yml" \
            ps -q frontend)
          test -n "$frontend_id"

          actual_image=$(docker inspect "$frontend_id" --format '{{.Config.Image}}')
          test "$actual_image" = "$FRONTEND_IMAGE"

          build_sha=${FRONTEND_IMAGE##*:}
          expected_build="{\"git_sha\":\"$build_sha\"}"
          actual_build=$(docker exec "$frontend_id" cat /usr/share/nginx/html/build.json)
          test "$actual_build" = "$expected_build"

          actual_config=$(docker inspect "$backend_id" --format '{{index .Config.Labels "com.docker.compose.project.config_files"}}')
          test "$actual_config" = "$DEPLOY_PATH/deploy/docker-compose.prod.yml"

          docker exec "$backend_id" python -c \
            'from graph.builder import PIPELINE_VERSION; assert PIPELINE_VERSION == "m1-visible-foods", PIPELINE_VERSION'

          if [ -f "$legacy_compose" ]; then
            rm -f "$legacy_compose"
            echo "Removed retired legacy Compose file."
          fi

          echo "Deployment status:"
          BACKEND_IMAGE="$BACKEND_IMAGE" \
          FRONTEND_IMAGE="$FRONTEND_IMAGE" \
          docker compose \
            --project-name platter \
            --env-file /opt/platter/.env \
            -f "$DEPLOY_PATH/deploy/docker-compose.prod.yml" \
            ps

          REMOTE

          # A healthy container on the wrong VPS is not a production deploy.
          # Wait briefly for the tunnel, then prove that the public hostname
          # serves the frontend built by this workflow run.
          expected_build="{\"git_sha\":\"$IMAGE_TAG\"}"
          for attempt in $(seq 1 20); do
            public_build=$(curl --fail --silent --show-error \
              --max-time 15 \
              -H 'Cache-Control: no-cache' \
              "$PUBLIC_APP_URL/build.json" 2>/dev/null || true)
            if [ "$public_build" = "$expected_build" ]; then
              echo "Public deployment verified: $public_build"
              exit 0
            fi
            sleep 3
          done

          echo "Public deployment verification failed. Expected $expected_build from $PUBLIC_APP_URL/build.json; got: ${public_build:-<no response>}" >&2
          exit 1
